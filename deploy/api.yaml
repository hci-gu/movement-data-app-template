apiVersion: apps/v1
kind: Deployment
metadata:
    name: movement-api
spec:
    replicas: 1
    strategy:
        type: Recreate # Pending BankID attempts belong to one process; retries are needed after restart.
    selector:
        matchLabels:
            app: movement-api
    template:
        metadata:
            labels:
                app: movement-api
        spec:
            automountServiceAccountToken: false
            volumes:
                - name: movement-api-persistent-storage
                  persistentVolumeClaim:
                      claimName: movement-api-pv-claim
                - name: study-keys
                  secret:
                      secretName: movement-study-keys-test
                      defaultMode: 0440
                - name: test-consent
                  configMap:
                      name: movement-test-consent
            initContainers:
                - name: publish-test-consent
                  image: 'registry.k8s.gu.se/appademin/movement-api:0.0.3-kontoapi-test'
                  imagePullPolicy: Always
                  command: [/pb/app]
                  args:
                    - bankid
                    - publish-consent
                    - --file=/pb/consent/test-consent.txt
                    - --version=kontoapi-technical-v1
                    - --title=KontoAPI technical test
                    - --if-missing
                    - --dir=/pb/pb_data
                  env:
                    - name: STUDY_SKIP_DOTENV
                      value: "1"
                  volumeMounts:
                    - mountPath: /pb/pb_data
                      name: movement-api-persistent-storage
                    - mountPath: /pb/consent
                      name: test-consent
                      readOnly: true
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: [ALL]
            containers:
                - name: movement-api
                  image: 'registry.k8s.gu.se/appademin/movement-api:0.0.3-kontoapi-test'
                  imagePullPolicy: Always
                  startupProbe:
                      httpGet:
                          path: /api/health
                          port: web
                      periodSeconds: 5
                      failureThreshold: 24
                      timeoutSeconds: 3
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: web
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 3
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: web
                      periodSeconds: 30
                      timeoutSeconds: 3
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          memory: 512Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: [ALL]
                  ports:
                      - containerPort: 8080
                        name: web
                        protocol: TCP
                  volumeMounts:
                      - mountPath: /pb/pb_data
                        name: movement-api-persistent-storage
                      - mountPath: /pb/secrets
                        name: study-keys
                        readOnly: true
                  envFrom:
                    - configMapRef:
                        name: movement-kontoapi-config
                    - secretRef:
                        name: movement-kontoapi-test
                  env:
                    - name: STUDY_SKIP_DOTENV
                      value: "1"
                    - name: STUDY_SECRETS_FILE
                      value: /pb/secrets/study-keys.json
---         
apiVersion: v1
kind: Service
metadata:
    name: movement-api-service
spec:
    selector:
        app: movement-api
    ports:
        - protocol: TCP
          port: 8080
          targetPort: web
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
    name: movement-api
    annotations:
        kubernetes.io/tls-acme: 'true'
        haproxy.router.openshift.io/set-forwarded-headers: replace
spec:
    host: movement-api.test.appadem.in
    to:
        kind: Service
        name: movement-api-service
        weight: 100
    port:
        targetPort: 8080
    tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    wildcardPolicy: None
